version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sauraxt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sauraxt
      POSTGRES_PASSWORD: sauraxt_password
      POSTGRES_DB: sauraxt_music
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauraxt -d sauraxt_music"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sauraxt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
    container_name: sauraxt-music-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sauraxt:sauraxt_password@postgres:5432/sauraxt_music?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      API_HOST: 0.0.0.0
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  redis_data:
